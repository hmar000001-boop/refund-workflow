name: Java build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Record toolchain
        run: |
          java -version
          ./mvnw --version

      - name: Verify architecture boundaries
        run: bash scripts/check-core-boundaries.sh

      - name: Build and test all modules
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Inspect framework dependency resolution
        run: ./mvnw -B --no-transfer-progress -pl refund-phase0-spike dependency:tree -Dincludes=org.bsc.langgraph4j:*,dev.langchain4j:*

      - name: Upload all test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refund-workflow-test-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore
